name: Fraudbusters CI
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      target:
        description: Check all modules, rebuild images, or publish missing packages
        type: choice
        default: all
        options: [all, images, contracts]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  packages: read

jobs:
  affected:
    runs-on: ubuntu-latest
    outputs:
      java: ${{ steps.modules.outputs.java }}
      java_apps: ${{ steps.modules.outputs.java_apps }}
      publish: ${{ steps.modules.outputs.publish }}
      openapi: ${{ steps.modules.outputs.openapi }}
      erlang: ${{ steps.modules.outputs.erlang }}
      ui_changed: ${{ steps.modules.outputs.ui_changed }}
      infra_changed: ${{ steps.modules.outputs.infra_changed }}
      docs_changed: ${{ steps.modules.outputs.docs_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 -m unittest discover -s tests/ci -v
      - run: python3 scripts/verify-imports.py
      - id: modules
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          TARGET: ${{ inputs.target || 'changed' }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            scripts/affected-modules.sh --mode "$TARGET" --github-output >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = pull_request ]; then
            scripts/affected-modules.sh "$BASE" --head "$HEAD" --pr --github-output >> "$GITHUB_OUTPUT"
          else
            scripts/affected-modules.sh "$BASE" --head "$HEAD" --github-output >> "$GITHUB_OUTPUT"
          fi

  java:
    needs: affected
    if: needs.affected.outputs.java != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        module: ${{ fromJSON(needs.affected.outputs.java) }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Release versions include the imported source history.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.module.java }}
          cache: maven
      - uses: valitydev/action-setup-thrift@v1.0.3
        if: matrix.module.kind == 'thrift'
      - uses: actions/setup-node@v4
        if: matrix.module.kind == 'openapi'
        with:
          node-version: '16'
      - run: scripts/setup-ci-maven.sh
      - name: Verify independent module against published dependencies
        env:
          MODULE: ${{ matrix.module.path }}
          PROFILE: ${{ matrix.module.profile }}
          KIND: ${{ matrix.module.kind }}
        run: |
          args=()
          if [ -n "$PROFILE" ]; then args+=("-P$PROFILE"); fi
          # Imported contract POMs default to bare SNAPSHOT. Strict Maven model
          # validation requires a base version; verification never publishes it.
          if [ "$KIND" = thrift ] || [ "$KIND" = openapi ]; then args+=("-Drevision=0-SNAPSHOT"); fi
          mvn -B -ntp -f "$MODULE/pom.xml" verify -Dpath_to_thrift=thrift "${args[@]}"
      - name: Verify release packaging without signing or uploading
        if: matrix.module.kind == 'thrift' || matrix.module.kind == 'openapi' || matrix.module.kind == 'library'
        env:
          MODULE: ${{ matrix.module.path }}
          PROFILE: ${{ matrix.module.profile }}
        run: python3 scripts/publication.py "$MODULE" --prepare --profile "$PROFILE"
      - name: Prepare report name
        if: failure()
        env:
          MODULE: ${{ matrix.module.path }}
          PROFILE: ${{ matrix.module.profile }}
        run: echo "REPORT_NAME=${MODULE//\//-}-$PROFILE" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ${{ env.REPORT_NAME }}
          path: |
            ${{ matrix.module.path }}/target/surefire-reports/**
            ${{ matrix.module.path }}/target/failsafe-reports/**

  openapi:
    needs: affected
    if: needs.affected.outputs.openapi != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.affected.outputs.openapi) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: npm
          cache-dependency-path: ${{ matrix.module }}/package-lock.json
      - run: npm ci --prefix "$MODULE"
        env:
          MODULE: ${{ matrix.module }}
      - run: npm run validate --prefix "$MODULE" && npm run build --prefix "$MODULE"
        env:
          MODULE: ${{ matrix.module }}

  ui:
    needs: affected
    if: needs.affected.outputs.ui_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '23'
          cache: npm
          cache-dependency-path: apps/fraudbusters-ui/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: npm run ui:install
      - run: npm run ui:codegen
      - run: npm run ui:check
      - run: npm run ui:test
      - run: npm run build --prefix apps/fraudbusters-ui

  erlang:
    needs: affected
    if: needs.affected.outputs.erlang != '[]'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.affected.outputs.erlang) }}
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.module.otp }}
          rebar3-version: ${{ matrix.module.rebar }}
      - uses: valitydev/action-setup-thrift@v1.0.3
        with:
          thrift-version: 0.14.2.3
      - run: rebar3 compile
        working-directory: ${{ matrix.module.path }}

  infra:
    needs: affected
    if: needs.affected.outputs.infra_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/compose.yaml --profile core config --quiet
      - run: docker compose -f infra/compose.yaml --profile apps --profile e2e config --quiet
      - run: docker compose -f infra/compose.yaml -f infra/compose.arm.yaml --profile apps --profile e2e config --quiet
      - run: docker build -t fraudbusters-e2e:test tests/e2e

  docs:
    needs: affected
    if: needs.affected.outputs.docs_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r docs/requirements.txt -r docs/fraudo/requirements.txt mkdocs-gitbook
      - run: mkdocs build -f docs/mkdocs.yml -d site
      - run: mkdocs build -f docs/fraudo/mkdocs.yml -d site

  checks:
    name: Required checks
    needs: [affected, java, openapi, ui, erlang, infra, docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert results['affected']['result'] == 'success', results
          assert all(job['result'] in ('success', 'skipped') for job in results.values()), results
          PY

  java-images:
    needs: [affected, checks]
    if: >-
      !cancelled() && needs.affected.result == 'success' && needs.checks.result == 'success' &&
      github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch &&
      needs.affected.outputs.java_apps != '[]'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.affected.outputs.java_apps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        env:
          APP: ${{ matrix.app }}
        run: echo "tag=ghcr.io/${GITHUB_REPOSITORY_OWNER}/$APP:sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - id: registry
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
        run: python3 scripts/image-publication.py "$IMAGE" --platform linux/amd64 --platform linux/arm64 --github-output >> "$GITHUB_OUTPUT"
      - run: scripts/setup-ci-maven.sh
        if: steps.registry.outputs.exists != 'true'
      - if: steps.registry.outputs.exists != 'true'
        env:
          APP: ${{ matrix.app }}
        run: |
          mvn -B -ntp -P=-common -f "apps/$APP/pom.xml" package -DskipTests
          scripts/package-java-image.sh "$APP" .artifacts/image
      - uses: docker/build-push-action@v6
        if: steps.registry.outputs.exists != 'true'
        id: push
        with:
          context: .artifacts/image
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - env:
          IMAGE: ${{ steps.image.outputs.tag }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: python3 scripts/image-publication.py "$IMAGE" --require --platform linux/amd64 --platform linux/arm64 --expected-digest "$DIGEST"

  ui-image:
    needs: [affected, checks]
    if: >-
      !cancelled() && needs.affected.result == 'success' && needs.checks.result == 'success' &&
      github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch &&
      needs.affected.outputs.ui_changed == 'true'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '23'
          cache: npm
          cache-dependency-path: apps/fraudbusters-ui/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "tag=ghcr.io/${GITHUB_REPOSITORY_OWNER}/fraudbusters-ui:sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - id: registry
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
        run: python3 scripts/image-publication.py "$IMAGE" --platform linux/amd64 --platform linux/arm64 --github-output >> "$GITHUB_OUTPUT"
      - run: npm run ui:install && npm run ui:build
        if: steps.registry.outputs.exists != 'true'
      - uses: docker/build-push-action@v6
        if: steps.registry.outputs.exists != 'true'
        id: push
        with:
          context: apps/fraudbusters-ui
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - env:
          IMAGE: ${{ steps.image.outputs.tag }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: python3 scripts/image-publication.py "$IMAGE" --require --platform linux/amd64 --platform linux/arm64 --expected-digest "$DIGEST"

  publish-packages:
    needs: [affected, checks]
    if: >-
      !cancelled() && needs.affected.result == 'success' && needs.checks.result == 'success' &&
      github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch &&
      needs.affected.outputs.publish != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        module: ${{ fromJSON(needs.affected.outputs.publish) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.module.java }}
          cache: maven
          server-id: ossrh
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY || secrets.OSSRH_GPG_SECRET_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - run: scripts/setup-ci-maven.sh
      - uses: valitydev/action-setup-thrift@v1.0.3
        if: matrix.module.kind == 'thrift'
      - name: Publish missing immutable releases to existing Maven Central channel
        env:
          MODULE: ${{ matrix.module.path }}
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME || secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN || secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE || secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
        run: python3 scripts/publication.py "$MODULE"

  publication-checks:
    name: Publication checks
    needs: [affected, checks, java-images, ui-image, publish-packages]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/check-publication.py
