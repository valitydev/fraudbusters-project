name: Publish documentation
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r docs/requirements.txt -r docs/fraudo/requirements.txt mkdocs-gitbook
      - run: mkdocs build -f docs/mkdocs.yml -d "$GITHUB_WORKSPACE/.artifacts/site"
      - run: mkdocs build -f docs/fraudo/mkdocs.yml -d "$GITHUB_WORKSPACE/.artifacts/site/fraudo"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .artifacts/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
