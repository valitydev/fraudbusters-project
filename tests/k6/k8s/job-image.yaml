apiVersion: batch/v1
kind: Job
metadata:
  name: __NAME__
  labels:
    app.kubernetes.io/name: k6-regression
    k6-regression/suite: __SUITE__
    k6-regression/profile: __PROFILE__
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k6-regression
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 12345
        runAsGroup: 12345
        fsGroup: 12345
      containers:
        - name: k6
          image: __IMAGE__
          command: ["sh", "/k6/k8s/run-in-pod.sh"]
          envFrom:
            - configMapRef:
                name: __CONFIG__
            - secretRef:
                name: __SECRET__
                optional: true
          env:
__ENV__
          resources:
            requests: { cpu: "__CPU__", memory: "__MEMORY__" }
            limits: { cpu: "__CPU__", memory: "__MEMORY__" }
          volumeMounts:
            - { name: results, mountPath: /results }
      volumes:
        - name: results
          emptyDir: {}
