type: object
description: Результат проверки выплаты антифродом.
required:
  - withdrawalId
  - eventTime
  - amount
  - currency
  - resultStatus
properties:
  withdrawalId:
    type: string
  eventTime:
    type: string
    format: date-time
  partyId:
    type: string
  walletId:
    type: string
  amount:
    type: integer
    format: int64
  currency:
    type: string
  destinationType:
    description: Тип назначения выплаты; для назначений, кроме карты, история хранит только unknown.
    type: string
    enum:
      - bank_card
      - unknown
  cardToken:
    type: string
  bin:
    type: string
  lastDigits:
    type: string
  paymentSystem:
    type: string
  issuerCountry:
    type: string
  clientInfo:
    $ref: './ClientInfo.yaml'
  resultStatus:
    type: string
  checkedTemplate:
    type: string
  ruleChecked:
    type: string
