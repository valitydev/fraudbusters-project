type: object
description: Привязка шаблона выплат. Глобальная привязка задаётся без party и кошелька; кошелёк задаётся только вместе с party.
required:
  - templateId
properties:
  id:
    type: string
  templateId:
    type: string
  partyId:
    type: string
  walletId:
    type: string
  isGlobal:
    type: boolean
    default: false
  lastUpdateDate:
    type: string
    format: date-time
  modifiedByUser:
    type: string
