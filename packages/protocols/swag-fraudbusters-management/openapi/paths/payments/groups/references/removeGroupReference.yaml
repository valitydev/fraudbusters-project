delete:
  summary: Удаление ссылки на группу
  operationId: removeGroupReference
  tags:
    - group-reference
  parameters:
    - $ref: "../../../../components/parameters/id.yaml"
    - name: groupId
      in: query
      schema:
        type: string
    - name: partyId
      required: true
      in: query
      schema:
        type: string
    - name: shopId
      required: true
      in: query
      schema:
        type: string

  responses:
    '201':
      description: Removed group reference id
      content:
        application/json:
          schema:
            type: string
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
    '404':
      description: Not Found


