get:
  summary: Списки выплат, в которых есть записи
  operationId: getCurrentPayoutListNames
  tags:
    - payout-lists
  parameters:
    - name: listType
      in: query
      required: true
      schema:
        type: string
        enum:
          - white
          - black
          - grey
          - naming
  responses:
    '201':
      description: Current list names
      content:
        application/json:
          schema:
            $ref: '../../../components/responses/ListResponse.yaml'
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
    '404':
      description: Not Found
