get:
  summary: Поиск по спискам выплат
  operationId: filterPayoutLists
  tags:
    - payout-lists
  parameters:
    - name: listType
      in: query
      required: true
      schema:
        type: string
        enum:
          - white
          - black
          - grey
          - naming
    - name: listNames
      in: query
      schema:
        type: array
        items:
          type: string
    - $ref: "../../../components/parameters/searchValue.yaml"
    - $ref: "../../../components/parameters/size.yaml"
  responses:
    '201':
      description: Payout list records
      content:
        application/json:
          schema:
            $ref: '../../../components/responses/PayoutListRecordsResponse.yaml'
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
    '404':
      description: Not Found
