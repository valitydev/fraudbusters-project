post:
  summary: Добавление записей в списки выплат
  operationId: insertPayoutListRows
  tags:
    - payout-lists
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../components/requests/PayoutRowListRequest.yaml'
  responses:
    '201':
      description: Sent list commands
      content:
        application/json:
          schema:
            $ref: '../../../components/responses/ListResponse.yaml'
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
    '404':
      description: Not Found
delete:
  summary: Удаление записи из списка выплат
  operationId: removePayoutListRow
  tags:
    - payout-lists
  parameters:
    - name: listType
      in: query
      required: true
      schema:
        type: string
        enum:
          - white
          - black
          - grey
          - naming
    - name: listName
      in: query
      required: true
      schema:
        type: string
    - name: value
      in: query
      required: true
      schema:
        type: string
    - name: partyId
      in: query
      schema:
        type: string
    - name: walletId
      in: query
      schema:
        type: string
  responses:
    '201':
      description: Sent list command
      content:
        application/json:
          schema:
            $ref: '../../../components/responses/IdResponse.yaml'
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
    '404':
      description: Not Found
