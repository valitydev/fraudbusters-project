post:
  summary: Добавление шаблона выплат
  operationId: insertPayoutTemplate
  tags:
    - payout-template
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/Template.yaml'
  responses:
    '201':
      description: Created payout template
      content:
        application/json:
          schema:
            $ref: '../../../components/responses/CreateTemplateResponse.yaml'
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
    '404':
      description: Not Found
