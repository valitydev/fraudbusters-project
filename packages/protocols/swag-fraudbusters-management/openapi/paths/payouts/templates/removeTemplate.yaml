delete:
  summary: Удаление шаблона выплат
  operationId: removePayoutTemplate
  tags:
    - payout-template
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    '201':
      description: Removed payout template
      content:
        application/json:
          schema:
            $ref: '../../../components/responses/IdResponse.yaml'
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
    '404':
      description: Not Found
