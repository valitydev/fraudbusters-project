post:
  summary: Привязка шаблонов выплат
  operationId: insertPayoutReferences
  tags:
    - payout-reference
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '../../../components/schemas/PayoutReference.yaml'
  responses:
    '201':
      description: Created payout references
      content:
        application/json:
          schema:
            $ref: '../../../components/responses/ListResponse.yaml'
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
    '404':
      description: Not Found
delete:
  summary: Удаление привязки шаблона выплат
  operationId: removePayoutReference
  tags:
    - payout-reference
  parameters:
    - $ref: "../../../components/parameters/partyId.yaml"
    - $ref: "../../../components/parameters/walletId.yaml"
    - $ref: "../../../components/parameters/isGlobal.yaml"
  responses:
    '201':
      description: Removed payout reference
      content:
        application/json:
          schema:
            $ref: '../../../components/responses/IdResponse.yaml'
    '401':
      description: Unauthorized
    '403':
      description: Forbidden
    '404':
      description: Not Found
