<mat-sidenav-container>
    <mat-sidenav
        #sidenav
        role="navigation"
        [mode]="(narrow$ | async) ? 'over' : 'side'"
        [opened]="(narrow$ | async) === false"
        [fixedInViewport]="true"
    >
        <fb-navigate-menu>
            <div menu-footer class="profile-footer">
                <button
                    type="button"
                    class="profile-trigger"
                    [matMenuTriggerFor]="profileMenu"
                    aria-label="Open account menu"
                >
                    <span class="profile-avatar" aria-hidden="true">{{ userInitial }}</span>
                    <span class="profile-text">
                        <span class="profile-name">{{ getUsername() }}</span>
                        @if (roleSummary) {
                        <span class="profile-roles">{{ roleSummary }}</span>
                        }
                    </span>
                    <mat-icon aria-hidden="true">unfold_more</mat-icon>
                </button>
            </div>
        </fb-navigate-menu>
    </mat-sidenav>

    <mat-menu #profileMenu="matMenu" yPosition="above" [overlapTrigger]="false" class="fb-account-menu">
        <fb-user-info [username]="getUsername()" [roles]="getUserRoles()"></fb-user-info>
        <mat-divider></mat-divider>
        <!-- Names the theme the item switches to: moon for night, sun for day. -->
        <button mat-menu-item type="button" (click)="toggleTheme()">
            <mat-icon>{{ darkTheme ? 'light_mode' : 'dark_mode' }}</mat-icon>
            <span>{{ darkTheme ? 'Light theme' : 'Dark theme' }}</span>
        </button>
        <button mat-menu-item type="button" (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>Sign out</span>
        </button>
    </mat-menu>

    <mat-sidenav-content role="main" class="content">
        @if (narrow$ | async) {
        <header class="mobile-header">
            <button mat-icon-button type="button" aria-label="Open navigation" (click)="sidenav.toggle()">
                <mat-icon>menu</mat-icon>
            </button>
            <span>Fraudbusters</span>
        </header>
        }
        <div class="workspace"><ng-content></ng-content></div>
    </mat-sidenav-content>
</mat-sidenav-container>
