<div class="notifications-page">
    <header class="fb-page-toolbar">
        <div class="heading">
            <h1 class="fb-page-title">Notifications</h1>
            <p class="fb-page-subtitle">Periodic reports on rule results and the channels they are sent to.</p>
        </div>
        <a *ngIf="activeTab() as tab" mat-stroked-button class="fb-primary-action" [routerLink]="tab.createUrl">
            <mat-icon>add</mat-icon>
            {{ tab.createLabel }}
        </a>
    </header>
    <nav mat-tab-nav-bar [tabPanel]="tabPanel" class="fb-template-catalog-tabs" aria-label="Notification sections">
        <a
            mat-tab-link
            *ngFor="let link of links"
            [routerLink]="link.path"
            routerLinkActive
            #rla="routerLinkActive"
            [active]="rla.isActive"
        >
            {{ link.name }}
        </a>
    </nav>
    <mat-tab-nav-panel #tabPanel>
        <router-outlet></router-outlet>
    </mat-tab-nav-panel>
</div>
