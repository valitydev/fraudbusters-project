<div *ngIf="view$ | async as view" class="fb-page fb-page-catalog">
    <header *ngIf="view.title" class="fb-page-toolbar">
        <div class="lists-heading">
            <h1 class="fb-page-title">{{ view.title }}</h1>
            <p class="fb-page-subtitle">{{ view.subtitle }}</p>
        </div>
        <a
            *ngIf="view.action?.createUrl"
            mat-stroked-button
            class="fb-primary-action"
            [routerLink]="view.action.createUrl"
            [queryParams]="{ returnUrl: view.url }"
        >
            <mat-icon>add</mat-icon>{{ view.action.createLabel }}
        </a>
    </header>
    <nav
        mat-tab-nav-bar
        [tabPanel]="tabPanel"
        [class.fb-template-catalog-tabs]="
            view.title === 'Templates' || view.title === 'Lists' || view.title === 'Groups'
        "
    >
        <a
            mat-tab-link
            *ngFor="let link of view.links"
            [routerLink]="link.path"
            routerLinkActive
            #rla="routerLinkActive"
            [active]="rla.isActive"
        >
            <span class="fb-template-tab-label">
                <span
                    *ngIf="link.listType"
                    class="list-dot"
                    [ngClass]="'list-dot-' + link.path"
                    aria-hidden="true"
                ></span>
                {{ link.name }}
                <ng-container *ngIf="link.listType && (listCounts$ | async) as counts">
                    <span *ngIf="counts[link.path]" class="fb-template-tab-count">{{ counts[link.path] }}</span>
                </ng-container>
                <ng-container *ngIf="view.title === 'Groups' && (groupCounts$ | async) as counts">
                    <span *ngIf="counts[link.path] !== null" class="fb-template-tab-count">{{
                        counts[link.path]
                    }}</span>
                </ng-container>
                <ng-container *ngIf="view.title === 'Templates'">
                    <ng-container
                        *ngIf="rla.isActive && link.path === 'templates' && templateCatalog; else loadedTemplateCount"
                    >
                        <!-- The open catalog shows its live total, so removals update it right away. -->
                        <ng-container *ngIf="templateCatalog.view$ | async as catalog">
                            <span *ngIf="!catalog.busy && !catalog.failed" class="fb-template-tab-count">{{
                                catalog.total
                            }}</span>
                        </ng-container>
                    </ng-container>
                    <ng-template #loadedTemplateCount>
                        <ng-container *ngIf="templateCounts$ | async as counts">
                            <span *ngIf="counts[link.path] !== null" class="fb-template-tab-count">{{
                                counts[link.path]
                            }}</span>
                        </ng-container>
                    </ng-template>
                </ng-container>
            </span>
        </a>
    </nav>
    <mat-tab-nav-panel #tabPanel>
        <router-outlet (activate)="setActiveList($event)" (deactivate)="setActiveList(null)"></router-outlet>
    </mat-tab-nav-panel>
</div>
