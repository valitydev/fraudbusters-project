@if (catalog.view$ | async; as view) {
<fb-catalog-panel
    label="Payout templates"
    searchLabel="Search templates by ID or rule"
    itemName="templates"
    [count]="view.count"
    [visible]="view.rows.length"
    [summaryInFooter]="true"
    [busy]="view.busy"
    [failed]="view.failed"
    [sort]="view.sort"
    [sortOptions]="sortOptions"
    (sortChange)="catalog.sort($any($event))"
    (more)="catalog.more()"
    (retry)="catalog.refresh()"
>
    @if (view.rows.length) {
    <fb-payment-templates-list
        label="Payout templates"
        [templates]="view.rows"
        (editItem)="editTemplate($event)"
        (copyItem)="copyTemplate($event)"
        (deleteItem)="removeTemplate($event)"
    ></fb-payment-templates-list>
    }
</fb-catalog-panel>
}
