<div fxLayout="column" [fxLayoutGap]="layoutGapM">
    <div fxLayout fxLayoutAlign="space-between center">
        <form fxLayout fxLayoutGap="16px" [formGroup]="searchForm">
            <mat-form-field appearance="outline">
                <input matInput placeholder="Search" formControlName="searchQuery" type="string" autocomplete="false" />
            </mat-form-field>
        </form>
        <button mat-button color="primary" (click)="createTemplate()">CREATE TEMPLATE</button>
    </div>
    <div *ngIf="templates$ | async as templates">
        <div *ngIf="templates.length; else Empty" fxLayout="column" [fxLayoutGap]="layoutGapM">
            <fb-list-header [reserveToggleSpace]="true">
                <div class="fb-body-2" fxFlex>ID</div>
                <div class="fb-body-2" fxFlex="0 0 160px">Last update</div>
                <div class="fb-body-2" fxFlex>Modified by</div>
            </fb-list-header>
            <div *ngFor="let template of templates" fxLayout="column" [fxLayoutGap]="layoutGapM">
                <mat-expansion-panel>
                    <mat-expansion-panel-header>
                        <div fxLayout fxFlexFill fxLayoutAlign="start center" [fxLayoutGap]="layoutGapM">
                            <div class="fb-body-2" fxFlex>{{ template.id }}</div>
                            <div class="fb-body-2" fxFlex="0 0 160px">
                                {{ template.lastUpdateDate | date : 'yyyy-MM-dd HH:mm:ss' }}
                            </div>
                            <div class="fb-body-2" fxFlex>{{ template.modifiedByUser }}</div>
                        </div>
                    </mat-expansion-panel-header>
                    <div class="panel-content" fxLayout="column" [fxLayoutGap]="layoutGapM">
                        <mat-divider></mat-divider>
                        <div class="fb-body-1 fb-template" fxLayout="column" [fxLayoutGap]="layoutGapS">
                            <ng-container *ngFor="let rule of template.template | templateToRules">
                                <code>{{ rule }}</code>
                            </ng-container>
                        </div>
                        <mat-divider></mat-divider>
                        <div fxLayout fxLayoutAlign="end" [fxLayoutGap]="layoutGapM">
                            <button mat-button color="warn" (click)="removeTemplate(template.id)">Remove</button>
                            <button mat-button color="accent" (click)="copyTemplate(template.id)">Copy</button>
                            <button mat-button color="primary" (click)="editTemplate(template.id)">Edit</button>
                        </div>
                    </div>
                </mat-expansion-panel>
            </div>
            <fb-show-more-panel
                *ngIf="hasMore$ | async"
                [isLoading]="inProgress$ | async"
                (showMore)="fetchMore()"
            ></fb-show-more-panel>
        </div>
    </div>
    <div *ngIf="inProgress$ | async" fxLayout fxLayoutAlign="center">
        <mat-progress-spinner color="primary" mode="indeterminate" diameter="48"></mat-progress-spinner>
    </div>
    <ng-template #Empty>
        <fb-empty-search-result *ngIf="!(inProgress$ | async)"></fb-empty-search-result>
    </ng-template>
</div>
