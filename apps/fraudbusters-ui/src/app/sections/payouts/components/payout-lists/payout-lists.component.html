<fb-catalog-panel
    *ngIf="page$ | async as page"
    label="Payout list records"
    searchLabel="Search value, party or wallet"
    itemName="records"
    [summaryInFooter]="true"
    [count]="page.count"
    [visible]="page.rows.length"
    [busy]="inProgress$ | async"
    [failed]="failed$ | async"
    [sort]="sort | async"
    [sortOptions]="sortOptions"
    (sortChange)="setSort($event)"
    (more)="fetchMore()"
    (retry)="retry()"
>
    <label catalogFilters class="filter-control">
        List names
        <span class="catalog-select">
            <mat-select [formControl]="listNames" placeholder="All lists" aria-label="List names" multiple>
                <mat-option *ngFor="let name of listNames$ | async" [value]="name">{{ name }}</mat-option>
            </mat-select>
        </span>
    </label>
    <fb-list-records-table
        *ngIf="page.rows.length && (failed$ | async) === false"
        label="Payout list records"
        scope="Wallet"
        [rows]="page.rows"
        [grey]="isGrey"
        (remove)="removeRow($event)"
    ></fb-list-records-table>
</fb-catalog-panel>
