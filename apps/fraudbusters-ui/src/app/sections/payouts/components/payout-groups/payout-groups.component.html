@if (catalog.view$ | async; as view) {
<fb-catalog-panel
    label="Payout groups"
    searchLabel="Search group or template ID"
    itemName="groups"
    singularItemName="group"
    [summaryInFooter]="true"
    [count]="view.count"
    [visible]="view.rows.length"
    [busy]="view.busy"
    [failed]="view.failed"
    [sort]="view.sort"
    [sortOptions]="sortOptions"
    (sortChange)="catalog.sort($any($event))"
    (more)="catalog.more()"
    (retry)="catalog.refresh()"
>
    @if (view.rows.length) {
    <fb-groups-list
        label="Payout groups"
        [groups]="view.rows"
        (editItem)="editGroup($event)"
        (deleteItem)="removeGroup($event)"
        (duplicateItem)="duplicateGroup($event)"
    ></fb-groups-list>
    }
</fb-catalog-panel>
}
