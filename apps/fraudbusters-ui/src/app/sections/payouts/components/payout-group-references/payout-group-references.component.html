<div fxLayout="column" fxLayoutGap="16px">
    <mat-card>
        <mat-card-content [formGroup]="form" fxLayout="row wrap" fxLayoutGap="16px" fxLayoutAlign="start center">
            <mat-form-field>
                <mat-label>Group</mat-label>
                <mat-select formControlName="groupId">
                    <mat-option *ngFor="let groupId of groups$ | async" [value]="groupId">{{ groupId }}</mat-option>
                </mat-select>
            </mat-form-field>
            <mat-form-field>
                <mat-label>Party ID (empty for all payouts)</mat-label>
                <input matInput formControlName="partyId" />
            </mat-form-field>
            <mat-form-field>
                <mat-label>Wallet ID (optional)</mat-label>
                <input matInput formControlName="walletId" />
            </mat-form-field>
            <button mat-raised-button color="primary" [disabled]="form.invalid" (click)="save()">
                Add group reference
            </button>
        </mat-card-content>
    </mat-card>

    <mat-form-field>
        <mat-label>Search by party, wallet or group</mat-label>
        <input matInput #searchInput (keyup.enter)="search(searchInput.value)" />
    </mat-form-field>

    <ng-container *ngIf="references$ | async as references">
        <table mat-table [dataSource]="references" *ngIf="references.length; else empty">
            <ng-container matColumnDef="scope">
                <th mat-header-cell *matHeaderCellDef>Applies to</th>
                <td mat-cell *matCellDef="let reference">{{ describeScope(reference) }}</td>
            </ng-container>
            <ng-container matColumnDef="groupId">
                <th mat-header-cell *matHeaderCellDef>Group</th>
                <td mat-cell *matCellDef="let reference">{{ reference.groupId }}</td>
            </ng-container>
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef></th>
                <td mat-cell *matCellDef="let reference">
                    <button mat-icon-button (click)="remove(reference)" aria-label="Remove group reference">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="columns"></tr>
            <tr mat-row *matRowDef="let row; columns: columns"></tr>
        </table>
    </ng-container>
    <ng-template #empty><fb-empty-search-result></fb-empty-search-result></ng-template>
</div>
