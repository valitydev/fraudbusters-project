<fb-catalog-panel
    *ngIf="catalog.view$ | async as view"
    label="Payout group references"
    searchLabel="Find group, party or wallet"
    itemName="references"
    [summaryInFooter]="true"
    [count]="view.count"
    [visible]="view.rows.length"
    [busy]="view.busy"
    [failed]="view.failed"
    [sort]="view.sort"
    [sortOptions]="sortOptions"
    (sortChange)="catalog.sort($any($event))"
    (more)="catalog.more()"
    (retry)="catalog.refresh()"
>
    <fb-reference-table
        *ngIf="view.rows.length"
        label="Payout group references"
        target="Group"
        targetRoute="/payouts/group"
        scope="Wallet"
        [rows]="view.rows"
        [showAuthor]="true"
        (remove)="removeReference($event)"
    ></fb-reference-table>
</fb-catalog-panel>
