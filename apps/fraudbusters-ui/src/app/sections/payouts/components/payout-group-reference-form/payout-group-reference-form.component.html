<div fxLayout="column">
    <fb-headline fbSecondaryTitle>New group references</fb-headline>
    <mat-card>
        <mat-card-content fxLayout="column" [fxLayoutGap]="layoutGapM">
            <ng-container *ngFor="let form of forms.controls; let i = index">
                <form [formGroup]="form" fxLayout [fxLayoutGap]="layoutGapM" fxLayoutAlign="center center">
                    <mat-form-field fxFlex appearance="outline">
                        <input
                            matInput
                            placeholder="Group ID"
                            formControlName="groupId"
                            type="string"
                            [matAutocomplete]="auto"
                        />
                        <mat-autocomplete autoActiveFirstOption #auto="matAutocomplete">
                            <mat-option *ngFor="let option of groupIds$ | async" [value]="option">
                                {{ option }}
                            </mat-option>
                        </mat-autocomplete>
                    </mat-form-field>
                    <mat-form-field fxFlex appearance="outline">
                        <input
                            matInput
                            placeholder="Party ID"
                            formControlName="partyId"
                            type="string"
                            autocomplete="false"
                        />
                    </mat-form-field>
                    <mat-form-field fxFlex appearance="outline">
                        <input
                            matInput
                            placeholder="Wallet ID"
                            formControlName="walletId"
                            type="string"
                            autocomplete="false"
                        />
                    </mat-form-field>
                    <button
                        [style.visibility]="forms.length > 1 ? 'visible' : 'hidden'"
                        mat-icon-button
                        (click)="removeItem(i)"
                        [disabled]="inProgress$ | async"
                    >
                        <mat-icon>remove</mat-icon>
                    </button>
                </form>
            </ng-container>
            <div fxLayout fxLayoutAlign="end center" [fxLayoutGap]="layoutGapM">
                <button
                    mat-button
                    color="accent"
                    (click)="addItem()"
                    [disabled]="!forms.valid || (inProgress$ | async)"
                >
                    Add Reference
                </button>
                <button
                    mat-raised-button
                    color="primary"
                    (click)="createReference()"
                    [disabled]="!forms.valid || (inProgress$ | async)"
                >
                    Create
                </button>
            </div>
        </mat-card-content>
        <mat-card-footer *ngIf="inProgress$ | async">
            <mat-progress-bar mode="indeterminate"></mat-progress-bar>
        </mat-card-footer>
    </mat-card>
</div>
