<div fxLayout="column" [fxLayoutGap]="layoutGapL">
    <div fxLayout fxLayoutAlign="start center" [fxLayoutGap]="layoutGapM">
        <mat-icon (click)="back()">keyboard_backspace</mat-icon>
        <h3 class="fb-headline">{{ title }}</h3>
    </div>
    <mat-card>
        <mat-card-content fxLayout="column" [fxLayoutGap]="layoutGapL">
            <form [formGroup]="form" fxLayout="column" [fxLayoutGap]="layoutGapL">
                <mat-form-field class="full-width" floatLabel="always" appearance="outline">
                    <input required matInput placeholder="Name" formControlName="id" />
                </mat-form-field>
                <mat-form-field class="full-width" floatLabel="always" appearance="outline">
                    <textarea
                        required
                        matInput
                        placeholder="Templates rules"
                        formControlName="template"
                        class="code-editor"
                    ></textarea>
                </mat-form-field>
            </form>
            <div *ngFor="let error of errors" class="mat-error">{{ error }}</div>
            <div fxLayout fxLayoutAlign="end" [fxLayoutGap]="layoutGapM">
                <button mat-button color="accent" [disabled]="inProgress$ | async" (click)="validateTemplate()">
                    Validate
                </button>
                <button
                    mat-button
                    color="primary"
                    [disabled]="form.invalid || (inProgress$ | async)"
                    (click)="saveTemplate()"
                >
                    {{ editing ? 'Save' : 'Create' }}
                </button>
            </div>
        </mat-card-content>
        <mat-card-footer *ngIf="inProgress$ | async">
            <mat-progress-bar mode="indeterminate"></mat-progress-bar>
        </mat-card-footer>
    </mat-card>
</div>
