<div class="fb-page">
    <header class="fb-page-header">
        <button
            mat-stroked-button
            class="fb-template-back"
            type="button"
            aria-label="Back to templates"
            (click)="back()"
        >
            <mat-icon>arrow_back</mat-icon>
        </button>
        <div>
            <h1 class="fb-page-title">{{ title }}</h1>
            <p class="fb-page-subtitle">
                {{
                    editing
                        ? 'Update and validate the rules in this payout template.'
                        : 'Write and validate rules for payout checks.'
                }}
            </p>
        </div>
    </header>
    <mat-progress-bar *ngIf="loading" mode="indeterminate" aria-label="Loading template"></mat-progress-bar>
    <p *ngIf="loadFailed" role="alert">Could not load template.</p>
    <fb-template-editor
        *ngIf="!loading && !loadFailed"
        [payout]="true"
        [form]="form"
        [template]="template"
        [isEditableName]="!editing"
        [busy]="inProgress$ | async"
        [validationMessage]="validationMessage"
        [checkedRule]="checkedRule"
        (validate)="validateTemplate()"
        (save)="saveTemplate()"
    ></fb-template-editor>
</div>
