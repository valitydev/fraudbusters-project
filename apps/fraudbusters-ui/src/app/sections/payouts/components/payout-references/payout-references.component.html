@if (catalog.view$ | async; as view) {
<fb-catalog-panel
    label="Payout template references"
    searchLabel="Find template, party or wallet"
    itemName="references"
    [summaryInFooter]="true"
    [count]="view.count"
    [visible]="view.rows.length"
    [busy]="view.busy"
    [failed]="view.failed"
    [sort]="view.sort"
    [sortOptions]="sortOptions"
    (sortChange)="catalog.sort($any($event))"
    (more)="catalog.more()"
    (retry)="catalog.refresh()"
>
    @if (view.rows.length) {
    <fb-reference-table
        label="Payout template references"
        target="Template"
        targetRoute="/payouts/template"
        scope="Wallet"
        [rows]="view.rows"
        [showAuthor]="true"
        [showGlobal]="true"
        (remove)="removeReference($event)"
    ></fb-reference-table>
    }
</fb-catalog-panel>
}
