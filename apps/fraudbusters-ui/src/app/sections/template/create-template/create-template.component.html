<div class="fb-page">
    <header class="fb-page-header">
        <button
            mat-stroked-button
            class="fb-template-back"
            type="button"
            aria-label="Back to templates"
            (click)="back()"
        >
            <mat-icon>arrow_back</mat-icon>
        </button>
        <div>
            <h1 class="fb-page-title">New template</h1>
            <p class="fb-page-subtitle">Write and validate rules for payment checks.</p>
        </div>
    </header>
    <fb-create-template></fb-create-template>
</div>
