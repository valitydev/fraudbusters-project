<div class="fb-template-table">
    <fb-template-header></fb-template-header>
    <div *ngFor="let template of templates" class="fb-template-row">
        <fb-template-item
            [template]="template"
            (editItem)="editItem.emit($event)"
            (deleteItem)="deleteItem.emit($event)"
            (copyItem)="copyItem.emit($event)"
        ></fb-template-item>
    </div>
</div>
