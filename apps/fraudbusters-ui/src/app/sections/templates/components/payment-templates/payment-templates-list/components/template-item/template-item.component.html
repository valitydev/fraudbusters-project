<mat-expansion-panel>
    <mat-expansion-panel-header>
        <div fxLayout fxFlexFill fxLayoutAlign="start center" [fxLayoutGap]="layoutGapM">
            <div class="fb-body-2" fxFlex>{{ template.id }}</div>
            <div class="fb-body-2" fxFlex="0 0 160px">{{ template.lastUpdateDate | date : 'yyyy-MM-dd HH:mm:ss' }}</div>
            <div class="fb-body-2" fxFlex>{{ template.modifiedByUser || '—' }}</div>
        </div>
    </mat-expansion-panel-header>
    <div class="fb-template-detail">
        <div class="fb-template-rules">
            <div class="fb-template-rules-label">Rules</div>
            <div class="fb-template-rules-code">
                <code *ngFor="let rule of template.template | templateToRules">{{ rule }}</code>
            </div>
        </div>
        <fb-actions
            [id]="template.id"
            (editItem)="editItem.emit($event)"
            (deleteItem)="deleteItem.emit($event)"
            (copyItem)="copyItem.emit($event)"
        ></fb-actions>
    </div>
</mat-expansion-panel>
