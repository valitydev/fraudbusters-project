<div class="fb-template-actions" role="group" aria-label="Template actions">
    <button mat-stroked-button type="button" class="fb-template-remove" (click)="deleteItem.emit(id)">Remove</button>
    <button mat-stroked-button type="button" (click)="copyItem.emit(id)">Copy</button>
    <button mat-stroked-button type="button" class="fb-template-edit" (click)="editItem.emit(id)">Edit</button>
</div>
