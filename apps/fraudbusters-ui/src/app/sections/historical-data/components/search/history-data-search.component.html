<form class="fb-filter-stack" [formGroup]="form">
    <div class="fb-filter-fields">
        <mat-form-field appearance="outline" floatLabel="always" subscriptSizing="dynamic" class="fb-filter-date">
            <mat-label>From</mat-label>
            <input matInput name="startCountTime" [ngxMatDatetimePicker]="pickerFrom" formControlName="from" />
            <mat-datepicker-toggle matIconSuffix [for]="pickerFrom"></mat-datepicker-toggle>
            <ngx-mat-datetime-picker showSeconds="true" #pickerFrom></ngx-mat-datetime-picker>
        </mat-form-field>
        <mat-form-field appearance="outline" floatLabel="always" subscriptSizing="dynamic" class="fb-filter-date">
            <mat-label>To</mat-label>
            <input matInput name="startCountTime" [ngxMatDatetimePicker]="pickerTo" formControlName="to" />
            <mat-datepicker-toggle matIconSuffix [for]="pickerTo"></mat-datepicker-toggle>
            <ngx-mat-datetime-picker showSeconds="true" #pickerTo></ngx-mat-datetime-picker>
        </mat-form-field>
    </div>
    <div class="fb-filter-fields">
        <mat-form-field appearance="outline" floatLabel="always" subscriptSizing="dynamic">
            <mat-label>Party ID</mat-label>
            <input matInput formControlName="partyId" autocomplete="off" />
        </mat-form-field>
        <mat-form-field *ngIf="!isPayout" appearance="outline" floatLabel="always" subscriptSizing="dynamic">
            <mat-label>Shop ID</mat-label>
            <input matInput formControlName="shopId" autocomplete="off" />
        </mat-form-field>
        <mat-form-field *ngIf="isPayout" appearance="outline" floatLabel="always" subscriptSizing="dynamic">
            <mat-label>Wallet ID</mat-label>
            <input matInput formControlName="walletId" autocomplete="off" />
        </mat-form-field>
        <mat-form-field appearance="outline" floatLabel="always" subscriptSizing="dynamic">
            <mat-label>Card token</mat-label>
            <input matInput formControlName="cardToken" autocomplete="off" />
        </mat-form-field>
        <mat-form-field appearance="outline" floatLabel="always" subscriptSizing="dynamic">
            <mat-label>Country</mat-label>
            <input matInput formControlName="country" autocomplete="off" />
        </mat-form-field>
        <mat-form-field
            *ngIf="!hasWithdrawalStatusSelect"
            appearance="outline"
            floatLabel="always"
            subscriptSizing="dynamic"
        >
            <mat-label>Status</mat-label>
            <input matInput formControlName="status" autocomplete="off" />
        </mat-form-field>
        <mat-form-field
            *ngIf="hasWithdrawalStatusSelect"
            appearance="outline"
            floatLabel="always"
            subscriptSizing="dynamic"
        >
            <mat-label>Status</mat-label>
            <mat-select formControlName="status">
                <mat-option value="">any status</mat-option>
                <mat-option *ngFor="let status of payoutStatuses" [value]="status">{{ status }}</mat-option>
            </mat-select>
        </mat-form-field>
        <mat-form-field appearance="outline" floatLabel="always" subscriptSizing="dynamic">
            <mat-label>ID</mat-label>
            <input matInput formControlName="paymentId" autocomplete="off" />
        </mat-form-field>
        <mat-form-field appearance="outline" floatLabel="always" subscriptSizing="dynamic">
            <mat-label>Fingerprint</mat-label>
            <input matInput formControlName="fingerprint" autocomplete="off" />
        </mat-form-field>
        <mat-form-field appearance="outline" floatLabel="always" subscriptSizing="dynamic">
            <mat-label>Customer ID</mat-label>
            <input matInput formControlName="customerId" />
        </mat-form-field>
        <mat-form-field appearance="outline" floatLabel="always" subscriptSizing="dynamic">
            <mat-label>User ID</mat-label>
            <input matInput formControlName="userId" />
        </mat-form-field>
        <mat-form-field appearance="outline" floatLabel="always" subscriptSizing="dynamic">
            <mat-label>Email</mat-label>
            <input matInput formControlName="email" autocomplete="off" />
        </mat-form-field>
        <mat-form-field appearance="outline" floatLabel="always" subscriptSizing="dynamic">
            <mat-label>Terminal</mat-label>
            <input matInput formControlName="terminal" autocomplete="off" />
        </mat-form-field>
        <mat-form-field *ngIf="showRuleFilters" appearance="outline" floatLabel="always" subscriptSizing="dynamic">
            <mat-label>Template</mat-label>
            <input matInput formControlName="template" autocomplete="off" />
        </mat-form-field>
        <mat-form-field *ngIf="showRuleFilters" appearance="outline" floatLabel="always" subscriptSizing="dynamic">
            <mat-label>Rule</mat-label>
            <input matInput formControlName="rule" autocomplete="off" />
        </mat-form-field>
    </div>
</form>
