<div class="historical-page">
    <header class="fb-page-toolbar">
        <div class="heading">
            <h1 class="fb-page-title">{{ title }}</h1>
            <p class="fb-page-subtitle">{{ subtitle }}</p>
        </div>
        <div class="header-actions">
            <ng-container *ngTemplateOutlet="actions.template$ | async"></ng-container>
        </div>
    </header>
    <nav mat-tab-nav-bar [tabPanel]="tabPanel" class="fb-template-catalog-tabs" [attr.aria-label]="title + ' tabs'">
        @for (link of links; track link) {
        <a
            mat-tab-link
            [routerLink]="link.path"
            queryParamsHandling="preserve"
            routerLinkActive
            #rla="routerLinkActive"
            [active]="rla.isActive"
        >
            <span class="tab-label">
                <span class="tab-dot" [style.background]="link.dot" aria-hidden="true"></span>
                {{ link.name }}
            </span>
        </a>
        }
    </nav>
    <mat-tab-nav-panel #tabPanel>
        <router-outlet></router-outlet>
    </mat-tab-nav-panel>
</div>
