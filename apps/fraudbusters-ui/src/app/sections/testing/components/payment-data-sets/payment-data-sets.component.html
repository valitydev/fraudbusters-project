@if ({ dataSets: (dataSets$ | async) ?? [] }; as view) {
<fb-catalog-panel
    label="Data sets"
    searchLabel="Search data sets by name"
    searchParam="searchValue"
    itemName="data sets"
    singularItemName="data set"
    [summaryInFooter]="true"
    [count]="view.dataSets.length"
    [visible]="view.dataSets.length"
    [busy]="(inProgress$ | async) ?? true"
    [failed]="failed$ | async"
    [continuationAvailable]="(hasMore$ | async) ?? false"
    (more)="fetchMore()"
    (retry)="reload()"
>
    <fb-datetime-range
        catalogFilters
        [from]="range.from"
        [to]="range.to"
        (rangeChange)="setRange($event)"
    ></fb-datetime-range>
    @if (view.dataSets.length) {
    <fb-payment-data-sets-list
        [dataSets]="view.dataSets"
        (goToDataSet)="goToDataSet($event)"
        (deleteItem)="removeDataSet($event)"
    ></fb-payment-data-sets-list>
    }
</fb-catalog-panel>
}
