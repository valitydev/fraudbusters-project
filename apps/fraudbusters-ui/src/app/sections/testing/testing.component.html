<div class="fb-page fb-page-catalog">
    <header class="fb-page-toolbar">
        <div>
            <h1 class="fb-page-title">Testing</h1>
            <p class="fb-page-subtitle">Run payment rules on data sets and emulate individual transactions.</p>
        </div>
    </header>
    <nav mat-tab-nav-bar [tabPanel]="tabPanel" class="fb-template-catalog-tabs" aria-label="Testing sections">
        @for (link of links; track link) {
        <a
            mat-tab-link
            [routerLink]="link.path"
            routerLinkActive
            #rla="routerLinkActive"
            [active]="rla.isActive || hasActiveFragments(link.otherActiveUrlFragments)"
        >
            <span class="fb-template-tab-label">{{ link.name }}</span>
        </a>
        }
    </nav>
    <mat-tab-nav-panel #tabPanel>
        <router-outlet></router-outlet>
    </mat-tab-nav-panel>
</div>
