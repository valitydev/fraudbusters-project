<div class="fb-page fb-page-catalog">
    <header class="fb-page-toolbar">
        <div>
            <h1 class="fb-page-title">Groups</h1>
            <p class="fb-page-subtitle">Set the order of payment rule templates and manage their bindings.</p>
        </div>
        @if (activeTab; as tab) {
        <a
            mat-stroked-button
            class="fb-primary-action"
            [routerLink]="tab.createUrl"
            [queryParams]="{ returnUrl: returnUrl }"
        >
            <mat-icon>add</mat-icon>
            {{ tab.createLabel }}
        </a>
        }
    </header>
    <nav mat-tab-nav-bar [tabPanel]="tabPanel" class="fb-template-catalog-tabs" aria-label="Group sections">
        @for (link of links; track link) {
        <a
            mat-tab-link
            [routerLink]="link.path"
            routerLinkActive
            #rla="routerLinkActive"
            [active]="rla.isActive || hasActiveFragments(link.otherActiveUrlFragments)"
        >
            <span class="fb-template-tab-label">
                {{ link.name }}
                @if (counts$ | async; as counts) { @if (counts[link.path] !== null) {
                <span class="fb-template-tab-count">{{ counts[link.path] }}</span>
                } }
            </span>
        </a>
        }
    </nav>
    <mat-tab-nav-panel #tabPanel>
        <router-outlet></router-outlet>
    </mat-tab-nav-panel>
</div>
