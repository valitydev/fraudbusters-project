<fb-catalog-panel
    *ngIf="references$ | async as page"
    label="Group references"
    searchLabel="Find group, party or shop"
    itemName="references"
    [summaryInFooter]="true"
    [count]="page.count ?? page.result.length"
    [visible]="page.result.length"
    [busy]="inProgress$ | async"
    [sort]="sort"
    [sortOptions]="sortOptions"
    (sortChange)="setSort($any($event))"
    (more)="fetchMore(page.result[page.result.length - 1].groupId)"
>
    <fb-group-references-list
        *ngIf="page.result.length"
        [references]="page.result"
        (deleteItem)="removeReference($event)"
    ></fb-group-references-list>
</fb-catalog-panel>
