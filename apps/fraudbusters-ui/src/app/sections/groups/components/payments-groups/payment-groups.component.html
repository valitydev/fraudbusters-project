<fb-catalog-panel
    *ngIf="view$ | async as view"
    label="Groups"
    searchLabel="Search group or template ID"
    itemName="groups"
    singularItemName="group"
    [summaryInFooter]="true"
    [count]="view.groups.length"
    [visible]="view.groups.length"
    [busy]="inProgress$ | async"
    [sort]="view.sort"
    [sortOptions]="sortOptions"
    (sortChange)="setSort($any($event))"
>
    <fb-groups-list
        *ngIf="view.groups.length"
        [groups]="view.groups"
        (editItem)="editGroup($event)"
        (deleteItem)="removeGroup($event)"
        (duplicateItem)="duplicateGroup($event)"
    ></fb-groups-list>
</fb-catalog-panel>
