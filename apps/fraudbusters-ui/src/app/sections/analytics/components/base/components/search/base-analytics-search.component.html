<form *ngIf="currencies$ | async as currencies; else currencyUnavailable" class="fb-filter-stack" [formGroup]="form">
    <div class="period-row">
        <div class="fb-filter-presets" role="group" aria-label="Period">
            <button
                *ngFor="let period of periods"
                mat-stroked-button
                type="button"
                [attr.aria-pressed]="form.value.time === period.key"
                (click)="setPeriod(period.key)"
            >
                {{ period.label }}
            </button>
        </div>
        <div class="fb-filter-fields period-dates">
            <mat-form-field appearance="outline" floatLabel="always" subscriptSizing="dynamic">
                <mat-label>From (UTC)</mat-label>
                <input matInput type="date" formControlName="from" [max]="today" />
            </mat-form-field>
            <span aria-hidden="true">–</span>
            <mat-form-field appearance="outline" floatLabel="always" subscriptSizing="dynamic">
                <mat-label>To (UTC)</mat-label>
                <input matInput type="date" formControlName="to" [max]="today" />
            </mat-form-field>
        </div>
    </div>
    <p *ngIf="invalidRange" class="date-error" role="alert">
        Enter a valid UTC date range. Earlier results use the last valid selection.
    </p>
    <div class="fb-filter-fields fb-filter-fields-fill">
        <mat-form-field appearance="outline" floatLabel="always" subscriptSizing="dynamic">
            <mat-label>Merchant</mat-label>
            <input #merchant matInput placeholder="Merchant ID" formControlName="partyId" autocomplete="off" />
        </mat-form-field>
        <mat-form-field appearance="outline" floatLabel="always" subscriptSizing="dynamic">
            <mat-label>Shop</mat-label>
            <input #shop matInput placeholder="Shop ID" formControlName="shopId" autocomplete="off" />
        </mat-form-field>
        <mat-form-field appearance="outline" floatLabel="always" subscriptSizing="dynamic">
            <mat-label>Currency</mat-label>
            <mat-select formControlName="type">
                <mat-option *ngFor="let currency of currencies" [value]="currency">{{ currency }}</mat-option>
            </mat-select>
        </mat-form-field>
    </div>
    <p *ngIf="!currencies.length" class="date-error" role="status">
        No currencies are available for payment analytics.
    </p>
    <div
        *ngIf="currencies.length && hasActiveFilters(currencies[0])"
        class="fb-filter-summary"
        role="group"
        aria-label="Active filters"
    >
        <button
            *ngIf="form.value.partyId"
            type="button"
            class="fb-filter-chip"
            aria-label="Clear merchant filter"
            (click)="merchant.focus(); form.get('partyId').setValue('')"
        >
            <span>Merchant: {{ form.value.partyId }}</span
            ><span aria-hidden="true">×</span>
        </button>
        <button
            *ngIf="form.value.shopId"
            type="button"
            class="fb-filter-chip"
            aria-label="Clear shop filter"
            (click)="shop.focus(); form.get('shopId').setValue('')"
        >
            <span>Shop: {{ form.value.shopId }}</span
            ><span aria-hidden="true">×</span>
        </button>
        <button mat-button type="button" (click)="merchant.focus(); resetFilters(currencies[0])">Reset filters</button>
    </div>
</form>
<ng-template #currencyUnavailable>
    <p role="status">Loading payment filters…</p>
</ng-template>
