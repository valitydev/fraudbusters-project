<fb-template-editor
    [form]="form"
    [template]="template"
    [isEditableName]="isEditableName"
    [busy]="inProgress$ | async"
    [validationMessage]="validationMessage()"
    [checkedRule]="checkedRule"
    (validate)="validateTemplate()"
    (save)="saveTemplate()"
></fb-template-editor>
