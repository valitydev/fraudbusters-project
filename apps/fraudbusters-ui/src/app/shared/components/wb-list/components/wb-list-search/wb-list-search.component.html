<form class="fb-filter-fields" [formGroup]="form">
    <mat-form-field
        class="multi-select"
        appearance="outline"
        floatLabel="always"
        subscriptSizing="dynamic"
        *ngIf="listNames$ | async as listNames"
    >
        <mat-label>List names</mat-label>
        <mat-select formControlName="types" multiple>
            <mat-option *ngFor="let name of listNames" value="{{ name }}">{{ name }}</mat-option>
        </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline" floatLabel="always" subscriptSizing="dynamic">
        <mat-label>Search records</mat-label>
        <input matInput formControlName="searchQuery" autocomplete="off" />
    </mat-form-field>
</form>
