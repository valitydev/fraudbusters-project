<fb-catalog-panel
    *ngIf="page$ | async as page"
    [label]="label"
    searchLabel="Search value, party or shop"
    itemName="records"
    [summaryInFooter]="true"
    [count]="page.count"
    [visible]="page.rows.length"
    [busy]="inProgress$ | async"
    [sort]="sort"
    [sortOptions]="sortOptions"
    (sortChange)="setSort($any($event))"
    (more)="fetchMore()"
>
    <label catalogFilters class="filter-control">
        List names
        <span class="catalog-select">
            <mat-select [value]="listName" (valueChange)="setListName($event)" aria-label="List names">
                <mat-option value="">All lists</mat-option>
                <mat-option *ngFor="let name of listNames$ | async" [value]="name">
                    {{ name }}
                </mat-option>
            </mat-select>
        </span>
    </label>
    <fb-list-records-table
        *ngIf="page.rows.length"
        [label]="label"
        [rows]="page.rows"
        [grey]="isGrey"
        (remove)="removeRow($event)"
    ></fb-list-records-table>
</fb-catalog-panel>
