<h2 mat-dialog-title class="fb-dialog-title">{{ data.title || 'Confirm this action' }}</h2>
<mat-dialog-content *ngIf="data.message" class="fb-dialog-message">{{ data.message }}</mat-dialog-content>
<mat-dialog-actions align="end" class="fb-dialog-actions">
    <button mat-stroked-button type="button" class="fb-dialog-cancel" (click)="cancel()">Cancel</button>
    <button
        mat-flat-button
        type="button"
        color="primary"
        class="fb-dialog-confirm"
        [class.fb-dialog-danger]="data.destructive"
        (click)="confirm()"
    >
        {{ data.confirmLabel || 'Confirm' }}
    </button>
</mat-dialog-actions>
