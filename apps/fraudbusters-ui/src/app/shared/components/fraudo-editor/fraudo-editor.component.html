<div #editorViewport class="editor-viewport" [class.fixed-height]="fixedHeight" [class.numbered]="showLineNumbers">
    <div *ngIf="showLineNumbers" #gutter class="line-numbers" aria-hidden="true">
        <div
            *ngFor="let line of folded ? foldedLineNumbers : lineNumbers"
            [class.current]="!folded && line === cursorLine"
            [class.error-number]="!folded && errorLines.includes(line)"
        >
            {{ line }}
        </div>
    </div>
    <div class="fb-fraudo-editor fb-fraudo-code" [class.disabled]="disabled" [hidden]="folded">
        <div *ngIf="errorLines.length" class="diagnostics" aria-hidden="true">
            <div *ngFor="let line of errorLines" class="error-line" [style.--source-line]="line - 1"></div>
        </div>
        <pre #highlight class="highlight" aria-hidden="true"><code><span
            *ngFor="let token of tokens; let index = index"
            [class]="'fb-code-' + token.kind"
            [class.fb-code-problem]="token.problem"
            [class.fb-code-pair]="activePair.includes(index)"
        >{{ token.text }}</span>
</code></pre>
        <textarea
            #textarea
            [cdkTextareaAutosize]="autoGrow && !fixedHeight"
            [disabled]="disabled"
            [placeholder]="placeholder"
            [style.min-height.px]="fixedHeight ? null : minHeight"
            [attr.aria-label]="label"
            [attr.aria-invalid]="errorLines.length ? true : null"
            spellcheck="false"
            autocapitalize="off"
            autocomplete="off"
            (input)="update(textarea.value); updateCursor()"
            (keydown)="useHistory($event)"
            (keyup)="updateCursor()"
            (click)="updateCursor()"
            (select)="updateCursor()"
            (scroll)="syncScroll(textarea)"
            (blur)="onTouched(); activePair = []"
        ></textarea>
    </div>
    <pre
        *ngIf="folded"
        #foldPreview
        class="folded-preview fb-fraudo-code"
        tabindex="0"
        aria-label="Rules with long arguments folded. Press Enter to edit."
        (scroll)="syncGutter(foldPreview)"
        (click)="editPreview($event)"
        (keydown.enter)="editPreviewFromKeyboard($event)"
    ><code><ng-container *ngFor="let part of previewParts"><ng-container *ngIf="part.fold as fold; else sourcePart"><button
        type="button"
        class="fold-marker"
        title="Expand these arguments for editing"
        [attr.aria-label]="'Expand and edit ' + fold.hiddenCount + ' hidden arguments'"
        (click)="openFold($event, fold)"
    >{{ part.text }}</button></ng-container><ng-template #sourcePart><span [attr.data-source-start]="part.from"><span
        *ngFor="let token of part.text | fraudoTokens"
        [class]="'fb-code-' + token.kind"
    >{{ token.text }}</span></span></ng-template></ng-container></code></pre>
</div>
<div *ngIf="showLineNumbers || folds.length || problemMessage" class="cursor-position">
    <span *ngIf="showLineNumbers && !folded">Ln {{ cursorLine }}, Col {{ cursorColumn }}</span>
    <span *ngIf="problemMessage" class="problem-message">{{ problemMessage }}</span>
    <span *ngIf="folded">Long arguments folded</span>
    <button
        *ngIf="folds.length"
        mat-button
        type="button"
        class="fold-toggle"
        [attr.aria-expanded]="!folded"
        (click)="toggleArguments()"
    >
        {{ folded ? 'Expand to edit' : 'Fold long arguments' }}
    </button>
</div>
