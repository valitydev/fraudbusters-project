<form [formGroup]="form" class="fb-catalog-panel" aria-labelledby="rule-expression">
    <div class="table-toolbar fb-filter-fields test-filters">
        <fb-datetime-range
            fromLabel="Start timestamp"
            [single]="true"
            [from]="timestamp"
            (rangeChange)="form.controls.checkingTimestamp.setValue($event.from)"
        ></fb-datetime-range>
        <mat-form-field appearance="outline" floatLabel="always" subscriptSizing="dynamic">
            <mat-label>Party ID</mat-label>
            <input matInput formControlName="party" autocomplete="off" />
        </mat-form-field>
        <mat-form-field appearance="outline" floatLabel="always" subscriptSizing="dynamic">
            <mat-label>Shop ID</mat-label>
            <input matInput formControlName="shop" autocomplete="off" />
        </mat-form-field>
    </div>
    <header class="table-toolbar editor-heading">
        <h2 class="fb-section-title" id="rule-expression">Rule expression</h2>
    </header>
    <fb-fraudo-editor
        formControlName="template"
        label="Rules"
        [validationMessage]="checkedRule === form.controls.template.value ? validationMessage() : ''"
        [fixedHeight]="true"
        [showLineNumbers]="true"
    ></fb-fraudo-editor>
    <footer class="table-footer">
        <button mat-stroked-button type="button" [disabled]="inProgress$ | async" (click)="validateTemplate()">
            Validate
        </button>
        <button
            mat-stroked-button
            type="button"
            class="fb-primary-action"
            [disabled]="form.invalid || (inProgress$ | async)"
            (click)="testTemplate()"
        >
            Test
        </button>
    </footer>
    @if (inProgress$ | async) {
    <mat-progress-bar mode="indeterminate" aria-label="Running test or validation"></mat-progress-bar>
    }
</form>
