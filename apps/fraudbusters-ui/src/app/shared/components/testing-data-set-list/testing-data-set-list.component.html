<section class="fb-catalog-panel" aria-labelledby="result-heading">
    <header class="table-toolbar results-heading">
        <h2 class="fb-section-title" id="result-heading">Test results</h2>
        <span class="fb-template-tab-count">{{ rows.length }}</span>
    </header>
    @if (rows.length) {
    <fb-historical-table [kind]="kind" [rows]="rows"></fb-historical-table>
    } @else {
    <p class="table-state">No test results yet.</p>
    }
</section>
