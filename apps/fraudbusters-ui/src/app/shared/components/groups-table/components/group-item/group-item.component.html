<th scope="row">
    <code>{{ group.groupId }}</code>
</th>
<td>
    @if (group.priorityTemplates?.length) {
    <div class="group-preview">
        <code>{{ group.priorityTemplates[0].id }}</code>
        @if (group.priorityTemplates.length > 1) {
        <span class="fb-pill more-templates"> +{{ group.priorityTemplates.length - 1 }} more </span>
        }
    </div>
    } @else { — }
</td>
<td class="fb-catalog-time">
    {{ (group.lastUpdate | date : 'yyyy-MM-dd HH:mm:ss' : 'UTC') || '—' }}
</td>
<td class="fb-catalog-action-cell">
    <div class="fb-catalog-row-actions">
        <fb-actions
            [id]="group.groupId"
            (editItem)="editItem.emit($event)"
            (deleteItem)="deleteItem.emit($event)"
            (duplicateItem)="duplicateItem.emit($event)"
        ></fb-actions>
    </div>
</td>
